[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-lakehouse-portfolio"
version = "0.1.0"
description = "Zero-cost data engineering portfolio project with Python, DuckDB and SQL."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
